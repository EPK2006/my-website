<!DOCTYPE html>
<html>
<body>

<h2 class="fw-bold">HTML Forms</h2>

<form method="post" action="https://webdevbasics.net/scripts/demo.php">

  <label for="myname">My Name:</label><br>
  <input type="text" name="myname" value="John"><br><br>

  <label for="myEmail">Email:</label><br>
  <input type="email" name="myEmail"><br><br>

  <label for="myComments">Comments:</label><br>

<input type="submit" value="Submit">
</form>
